name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Azure resources
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_web_app_name: ${{ secrets.AZURE_WEBAPP_NAME }}
      TF_INPUT: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -out=tfplan -lock-timeout=5m

      - name: Apply
        run: terraform apply -lock-timeout=5m tfplan

      - name: Summary
        run: |
          {
            echo "### Infrastructure deployed"
            echo "- Web App: $(terraform output -raw web_app_url)"
            echo "- Key Vault: $(terraform output -raw key_vault_name)"
          } >> "$GITHUB_STEP_SUMMARY"
